name: Data API permissions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  grants:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: grants_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Rebuild without automatic grants and check role access
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
          PGDATABASE: grants_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/data_api_grants.sql
